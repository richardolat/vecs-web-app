<svg viewBox="0 0 1440 640" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2A4A"/>
      <stop offset="100%" stop-color="#071B30"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C99A2E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C99A2E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="640" fill="url(#bg1)"/>
  <rect width="720" height="640" fill="url(#glow1)"/>

  <!-- conference table -->
  <ellipse cx="720" cy="560" rx="640" ry="90" fill="#0F3050"/>
  <ellipse cx="720" cy="540" rx="600" ry="70" fill="#16416B" opacity="0.7"/>

  <!-- seated figures (abstract) -->
  <g fill="#0F3050" opacity="0.85">
    <ellipse cx="260" cy="470" rx="46" ry="60"/>
    <circle cx="260" cy="400" r="30"/>
    <ellipse cx="470" cy="490" rx="46" ry="60"/>
    <circle cx="470" cy="420" r="30"/>
    <ellipse cx="980" cy="490" rx="46" ry="60"/>
    <circle cx="980" cy="420" r="30"/>
    <ellipse cx="1180" cy="470" rx="46" ry="60"/>
    <circle cx="1180" cy="400" r="30"/>
  </g>

  <!-- standing presenter -->
  <g fill="#C99A2E">
    <ellipse cx="720" cy="380" rx="52" ry="120"/>
    <circle cx="720" cy="220" r="36"/>
  </g>

  <!-- screen behind presenter -->
  <rect x="600" y="60" width="240" height="140" rx="6" fill="#16416B" stroke="#E4C468" stroke-width="2" opacity="0.7"/>
  <line x1="620" y1="100" x2="820" y2="100" stroke="#E4C468" stroke-width="3" opacity="0.6"/>
  <line x1="620" y1="130" x2="780" y2="130" stroke="#E4C468" stroke-width="3" opacity="0.4"/>
  <line x1="620" y1="160" x2="800" y2="160" stroke="#E4C468" stroke-width="3" opacity="0.4"/>

  <!-- ambient light dots -->
  <g fill="#E4C468" opacity="0.5">
    <circle cx="120" cy="120" r="3"/>
    <circle cx="1320" cy="160" r="3"/>
    <circle cx="1380" cy="300" r="3"/>
    <circle cx="80" cy="340" r="3"/>
  </g>
</svg>
